<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background-color: #1a1a1a;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card{
      background-color:#e9e0e0cc;
      border-radius:15px;
      padding: 30px;
      width: 300px;
    }
    h2{
      color:#22045b;
      text-align: center;
      margin-bottom: 20px;
    }
    form{
      display: flex;
      flex-direction: column;
    }
    input{
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid black;
      border-radius: 5px;
      background-color:#d8d8d8;
    }
    button{
      background-color:blue ;
      color: #fff;
      padding: 10px;
      border-radius: 8px;

    }
    button:hover{
      background-color: rgb(50, 53, 149);
    }
    
  </style>
</head>
<body>
      <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" name="" id="" placeholder="Email" />
            <input type="password" name="" id="" placeholder="passswword">
            <button type="submit">Login</button>
        </form>
      </div>
</body>
</html>
