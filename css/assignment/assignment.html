<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment</title>
  <style>
    body{
      background-color: gray;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    h1{
      text-align: center;
    }
    .card{
      background-color: gray;
      flex-direction: column;
      height:300px;
      width: 300px;
      border: 2px solid black;
      display: flex;
      justify-content:start;
      align-items: center;
      border-radius: 10px;
    }
    .btn-group{
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 0 20px;
      margin-top: auto;
      box-sizing: border-box;
    }
    .btn{
      background-color: blue;
      color: white;
      border: none;
      width: 100px;
      height: 30px;
      align-self: flex-start;
      margin-left: 20px;
      margin-top: auto;
      margin-bottom: 20px;
      text-align: center;
      border-radius: 5px;
      cursor: pointer;  
    }
    .cart-btn{
       background-color: blue;
      color: white;
      border: none;
      width: 100px;
      height: 30px;
      align-self: flex-end;
      margin-right: 20px;
      margin-top: auto;
      margin-bottom: 20px;
      text-align: center;
      border-radius: 5px;
      cursor: pointer; 
    }
  </style>
</head>
<body>
  <h1>Simple card</h1>
  <div class="card">
    <h1>Shoping card</h1>

    <img src="shopping.webp" width="150px">
    <div class="btn-group">
      <button class="btn">Buy Now</button>
      <button class="cart-btn">Add to Cart</button>
    </div>
  </div>
</body>
</html>
